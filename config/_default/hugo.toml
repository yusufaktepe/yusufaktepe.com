baseURL = "https://yusufaktepe.com"
locale = "en"
title = "yusufaktepe.com"
theme = "hugo-theme-monochrome"
defaultContentLanguage = "en"
enableEmoji = true
enableGitInfo = true
disableHugoGeneratorInject = true
enableRobotsTXT = true

[minify]
  disableXML = true
  # minifyOutput = true

[permalinks]
  [permalinks.page]
    posts = "/:sections/:year/:contentbasename/"

[security]
    enableInlineShortcodes = true

[pagination]
pagerSize = 5

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[outputs]
home = ["HTML", "RSS", "JSON"]

# [services]
#   [services.disqus]
#     shortname = "yusufaktepe"

[frontmatter]
  # See: https://gohugo.io/methods/page/gitinfo/#last-modified-date
  lastmod = ['date', 'publishdate', 'pubdate', 'published', 'lastmod', 'modified']
